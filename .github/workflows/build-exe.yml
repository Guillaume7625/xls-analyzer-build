# ============================================================================
#  build-exe.yml — fabrique PC_XLS_Analyser.exe SANS posséder de PC Windows :
#  GitHub exécute le build sur un runner Windows x64 et publie l'exe en artefact.
#
#  Mode d'emploi :
#    1. Créer un dépôt GitHub PRIVÉ ; y pousser le CONTENU du dossier v2/ à la
#       racine (app/, app_main.py, requirements.txt, les .spec, ce fichier sous
#       .github/workflows/build-exe.yml).
#    2. Onglet Actions -> "build-exe" -> "Run workflow".
#    3. À la fin (~3-5 min), télécharger l'artefact "PC_XLS_Analyser-onefile"
#       -> il contient PC_XLS_Analyser.exe.
#
#  Note parc durci : le runner est un Windows Server récent ; le binaire produit
#  tourne sur Windows 10/11 x64. Pour une cible plus ancienne ou une exigence de
#  build maîtrisé (homologation), préférer un build local sur l'image de
#  référence du parc.
# ============================================================================
name: build-exe

on:
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions
  push:
    tags: ['v*']            # ou automatiquement sur un tag v1.0, v2.0...

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write        # requis pour créer la Release et y attacher l'exe
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Dépendances (versions figées du binaire d'origine)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests (sécurité de non-régression avant gel)
        run: pip install pytest httpx && python -m pytest tests/ -q

      - name: Gel PyInstaller — fichier unique
        run: pyinstaller PC_XLS_Analyser_onefile.spec --noconfirm

      - name: Empreinte SHA-256 (traçabilité, écrite à côté de l'exe)
        run: |
          $h = (Get-FileHash dist\PC_XLS_Analyser.exe -Algorithm SHA256).Hash
          Write-Host "SHA-256 : $h"
          "$h  PC_XLS_Analyser.exe" | Out-File -Encoding ascii dist\PC_XLS_Analyser.exe.sha256.txt

      # --- PUBLICATION EN RELEASE : un lien de telechargement direct du SEUL .exe ---
      # Le binaire (et son empreinte) sont attaches a une Release GitHub. Lien stable :
      #   https://github.com/<user>/<repo>/releases/latest/download/PC_XLS_Analyser.exe
      - name: Release + lien de telechargement direct
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: PC_XLS_Analyser ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          files: |
            dist/PC_XLS_Analyser.exe
            dist/PC_XLS_Analyser.exe.sha256.txt

      # Filet de securite : l'exe reste aussi recuperable en artefact de run.
      - name: Artefact de secours (onefile)
        uses: actions/upload-artifact@v4
        with:
          name: PC_XLS_Analyser-onefile
          path: dist/PC_XLS_Analyser.exe
